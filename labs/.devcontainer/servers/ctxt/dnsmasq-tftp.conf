# dnsmasq as TFTP-only server (DNS and DHCP disabled).
port=0
enable-tftp
tftp-root=/workspace/tftpd
# Answer from UDP 69 instead of a new ephemeral port per transfer. Docker Desktop's
# port proxy only relays replies that come back from the published port, so
# replies from other ports (tftpd-hpa's default behaviour) are dropped.
tftp-single-port
keep-in-foreground
log-facility=-
