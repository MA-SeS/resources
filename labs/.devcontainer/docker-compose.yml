services:

  toolchain:
    image: ma-ses-toolchain:latest
    #cap_add:
    #- MKNOD

    #security_opt:
    #- seccomp:unconfined

    privileged: true

    # Repair the named-volume owner before dropping to vscode in the command below.
    user: root
    
    environment:
    - TZ=Europe/Zurich
    # Keep Buildroot's configuration and generated files on the same filesystem
    # as its output. This avoids cross-device rename failures in syncconfig.
    - O=/workspace/buildroot/output
    
    volumes:
      - ..:/workspace
      - buildroot-data:/workspace/buildroot
      - tftpd-data:/workspace/tftpd
      - nfs-rootfs:/workspace/nfs-rootfs

    # Clone Buildroot into the volume on first startup, then keep the container alive.
    command: /bin/sh -c "set -e; chown vscode:vscode /workspace/buildroot; exec su vscode -s /bin/sh -c 'if [ ! -f /workspace/buildroot/Makefile ]; then git clone https://github.com/buildroot/buildroot /workspace/buildroot; git -C /workspace/buildroot checkout -b local-lts 2025.02.17; fi; while sleep 1000; do :; done'"

  servers:
    image: ma-ses-servers:latest

    privileged: true

    user: root

    # Published ports for tftp and nfs services, on all interfaces
    ports:
      - "69:69/udp"        # TFTP
      - "2049:2049/tcp"    # NFS
      - "20048:20048/tcp"  # NFS mountd

    volumes:
      - ..:/workspace
      - buildroot-data:/workspace/buildroot
      - tftpd-data:/workspace/tftpd
      - nfs-rootfs:/workspace/nfs-rootfs

    command:
      - /bin/sh
      - -ec
      - |
        service tftpd-hpa start
        exec ganesha.nfsd -F -L /var/log/ganesha/ganesha.log -f /etc/ganesha/ganesha.conf

# We create a volume for buildroot to avoid any problems with the "fakeowner" bug in
# tftpd-data is to store files to be served by the tftpd service
# nfs-rootfs is Linux root filesystem served by the nfsd service
volumes:
  buildroot-data:
    driver: local

  tftpd-data:
    driver: local

  nfs-rootfs:
    driver: local
